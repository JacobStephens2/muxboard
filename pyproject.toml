[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muxboard"
version = "0.1.3"
description = "Flask-embeddable web dashboard for managing tmux sessions across one host or a fleet, with live in-browser attach."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jacob Stephens" }]
keywords = ["tmux", "flask", "ssh", "terminal", "xterm", "dashboard", "ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "Flask>=2.3",
    "flask-sock>=0.7",
]

[project.optional-dependencies]
# gunicorn -k gevent needs both packages; gevent alone is not enough and
# gunicorn>=26 wants gevent>=24.10.1.
deploy = ["gunicorn>=22", "gevent>=24.10.1"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/JacobStephens2/muxboard"
Source = "https://github.com/JacobStephens2/muxboard"
Issues = "https://github.com/JacobStephens2/muxboard/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muxboard = ["templates/muxboard/*.html", "static/muxboard/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
